# Checks for this repository. (The deploy workflow for your own site is in
# github-actions/workflows/deploy-theme.yml; see the README.)
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint plugin PHP
        run: find git-auto-deploy -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Check shell scripts
        run: shellcheck github-actions/scripts/git-auto-deploy.sh tests/*.sh

  e2e:
    name: End-to-end deploys and rollbacks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: zip, pdo_sqlite, sqlite3
          coverage: none

      - name: Build a throwaway WordPress site
        run: bash tests/setup.sh

      - name: Serve it and run the tests
        run: |
          PHP_CLI_SERVER_WORKERS=4 php -S 127.0.0.1:8899 -t tests/.work/wordpress > tests/.work/server.log 2>&1 &
          for _ in $(seq 30); do curl -sf -o /dev/null http://127.0.0.1:8899/ && break; sleep 1; done
          bash tests/e2e.sh

      - name: Show logs
        if: failure()
        run: |
          tail -n 50 tests/.work/server.log || true
          tail -n 50 tests/.work/wordpress/debug.log || true
          cat tests/.work/out.json || true
